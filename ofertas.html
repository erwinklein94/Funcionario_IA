<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas — Funcionário Artificial</title>
<meta name="description" content="Produtos e soluções de funcionários de IA prontos para contratar.">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="ofertas" data-gate="cliente">

<section class="page-hero">
  <div class="wrap">
    <span class="label kicker">// PRODUTOS E SOLUÇÕES</span>
    <h1>Ofertas</h1>
    <p>Funcionários de IA prontos e serviços de manutenção publicados por desenvolvedores. Encontre a solução, conheça o autor e combine como preferir.</p>
  </div>
</section>

<section class="market wrap">
  <div class="market-bar">
    <div class="tabs">
      <button class="tab active" data-tab="hire">Funcionários IA</button>
      <button class="tab" data-tab="maint">Manutenção</button>
    </div>
    <div class="search">
      <span class="label">⌕</span>
      <input type="text" id="search" placeholder="buscar função, stack...">
    </div>
    <span class="label" id="count" style="width:100%;margin-top:4px">// 0 OFERTAS</span>
  </div>
  <div class="cards" id="cards"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
